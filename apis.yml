name: KeyMe
description: >-
  KeyMe is a nationwide locksmith and key-duplication company that pairs mobile
  locksmith technicians with a network of self-service key-copying kiosks located
  inside thousands of retail stores across the United States. Customers can copy
  residential, commercial, and automotive keys, RFID fobs and access cards at a
  kiosk, order duplicates online, or request 24/7 mobile locksmith help for home,
  auto, and business lockouts, transponder and ignition key programming, lock
  installation, re-keying, and access-control and master-key systems. KeyMe is
  backed by Battery Ventures. As of this profile the company operates as a
  consumer-facing locksmith and kiosk service and publishes no public developer
  API, SDK, or documentation surface; this record captures its public web
  identity for the API Evangelist network.
